<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overlord 2D - As 100 Câmaras do Supremo</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #040508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ecf0f1;
            font-family: 'Cinzel', 'Segoe UI', serif;
            user-select: none;
            overflow: hidden;
        }
        #hud {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            font-size: 11px;
            max-width: 960px;
            width: 95%;
            justify-content: space-between;
        }
        .barra-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .barra-fundo {
            width: 140px;
            height: 12px;
            background-color: #1e272e;
            border: 1px solid #485460;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .barra-hp {
            height: 100%;
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            width: 100%;
            transition: width 0.15s ease-out;
        }
        .barra-xp {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            width: 0%;
            transition: width 0.15s ease-out;
        }
        .barra-texto {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            font-size: 9px;
            line-height: 12px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-ui {
            background-color: #2c3e50;
            color: #ecf0f1;
            border: 1px solid #74b9ff;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
        }
        #area-canvas {
            position: relative;
            max-width: 960px;
            width: 95%;
            aspect-ratio: 960 / 576;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 2px solid #2d132c;
            background-color: #080c14;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            image-rendering: pixelated;
        }

        /* CONTROLES MOBILE TOUCH */
        #controles-mobile {
            display: none;
            position: absolute;
            bottom: 6px;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
        }
        .dpad, .acoes {
            display: flex;
            gap: 8px;
            align-items: center;
            pointer-events: auto;
        }
        .btn-touch {
            background: rgba(44, 62, 80, 0.65);
            border: 2px solid rgba(116, 185, 255, 0.7);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            user-select: none;
        }
        .btn-touch:active {
            background: rgba(116, 185, 255, 0.8);
            transform: scale(0.92);
        }

        /* TELA INICIAL */
        #tela-inicial {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0b2e 0%, #050308 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border: 3px solid #6c5ce7;
        }
        #tela-inicial h1 {
            font-size: 26px;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.7);
            margin-bottom: 6px;
            text-align: center;
        }
        #tela-inicial p {
            color: #a29bfe;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }
        .input-box {
            background-color: #0f071a;
            border: 2px solid #a29bfe;
            color: #f1c40f;
            font-size: 16px;
            padding: 8px 14px;
            border-radius: 6px;
            text-align: center;
            width: 240px;
            outline: none;
            font-family: inherit;
            margin-bottom: 16px;
        }
        .btn-iniciar {
            background: linear-gradient(135deg, #6c5ce7, #8e44ad);
            color: #fff;
            border: 2px solid #f1c40f;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div id="area-canvas">
        <!-- TELA INICIAL -->
        <div id="tela-inicial">
            <h1>AS 100 CÂMARAS DO SUPREMO</h1>
            <p>Nomeie o seu Soberano para despertar o trono:</p>
            <input type="text" id="input-nome" class="input-box" value="Ainz Ooal Gown" maxlength="18">
            <button class="btn-iniciar" onclick="iniciarAventura()">DESPERTAR</button>
        </div>

        <canvas id="jogoCanvas" width="960" height="576"></canvas>

        <!-- CONTROLES MOBILE -->
        <div id="controles-mobile">
            <div class="dpad">
                <div class="btn-touch" id="btn-left">◀</div>
                <div class="btn-touch" id="btn-up">▲</div>
                <div class="btn-touch" id="btn-right">▶</div>
            </div>
            <div class="acoes">
                <div class="btn-touch" id="btn-dash" style="border-color:#a29bfe; font-size: 11px;">DASH</div>
                <div class="btn-touch" id="btn-escudo" style="border-color:#00cec9; font-size: 11px;">BAR</div>
                <div class="btn-touch" id="btn-jump" style="border-color:#2ecc71;">▲ P</div>
                <div class="btn-touch" id="btn-fire" style="border-color:#e74c3c;">🔥</div>
            </div>
        </div>
    </div>

    <!-- HUD SUPERIOR -->
    <div id="hud">
        <div class="hud-item" id="hud-nome" style="color: #f1c40f; font-weight: bold;">Soberano</div>
        <div class="barra-container">
            <div class="barra-fundo">
                <div class="barra-hp" id="hp-preenchimento"></div>
                <div class="barra-texto" id="hp-texto">100 / 100 HP</div>
            </div>
            <div class="barra-fundo" style="height: 6px;">
                <div class="barra-xp" id="xp-preenchimento"></div>
            </div>
        </div>

        <div class="hud-item" id="hud-nivel" style="color: #9b59b6; font-weight: bold;">Nv. 1</div>
        <div class="hud-item" id="hud-geos" style="color: #f1c40f;">Geo: 0</div>
        <div class="hud-item" id="hud-fase" style="color: #74b9ff;">Fase: 1 / 100</div>
        <div class="hud-item" id="hud-escudo" style="color: #00cec9;">Escudo: Inativo</div>
        <button class="btn-ui" onclick="alternarStatus()">📊 [C]</button>
        <button class="btn-ui" id="btn-pause" onclick="alternarPause()">⏸️ [P]</button>
    </div>

    <script>
        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        const telaInicial = document.getElementById("tela-inicial");
        const inputNome = document.getElementById("input-nome");
        const hud = document.getElementById("hud");
        const hudNome = document.getElementById("hud-nome");
        const hpPreenchimento = document.getElementById("hp-preenchimento");
        const hpTexto = document.getElementById("hp-texto");
        const xpPreenchimento = document.getElementById("xp-preenchimento");
        const hudNivel = document.getElementById("hud-nivel");
        const hudGeos = document.getElementById("hud-geos");
        const hudFase = document.getElementById("hud-fase");
        const hudEscudo = document.getElementById("hud-escudo");
        const btnPause = document.getElementById("btn-pause");
        const controlesMobile = document.getElementById("controles-mobile");

        const TAM_BLOCO = 32;
        const COLUNAS = 30;
        const LINHAS = 18;
        const GRAVIDADE = 0.55;

        let jogoIniciado = false;
        let jogoPausado = false;
        let menuStatusAberto = false;

        const particulasAmbiente = Array.from({ length: 50 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            raio: Math.random() * 1.5 + 0.5,
            velY: -(Math.random() * 0.3 + 0.1),
            velX: (Math.random() - 0.5) * 0.2,
            opacidade: Math.random() * 0.6 + 0.2
        }));

        const BIOMAS = [
            { nome: "Câmara Mortuária de Nazarick", fundo: "#07040a", bloco: "#180a21", borda: "#3c1352" },
            { nome: "Floresta dos Mortos", fundo: "#08100d", bloco: "#0f231b", borda: "#1e4d3b" },
            { nome: "Minas de Sangue Carmesim", fundo: "#140608", bloco: "#290c10", borda: "#54161f" },
            { nome: "Catacumbas do Vazio", fundo: "#05070f", bloco: "#121b2d", borda: "#2a3d66" },
            { nome: "Santuário Proibido dos Deuses", fundo: "#130919", bloco: "#24102e", borda: "#581b70" }
        ];

        function gerarFase(indice) {
            const bioma = BIOMAS[Math.floor(indice / 20) % BIOMAS.length];
            const mapa = Array.from({ length: LINHAS }, () => Array(COLUNAS).fill(0));
            const ehFaseBoss = ((indice + 1) % 5 === 0);

            for (let c = 0; c < COLUNAS; c++) {
                mapa[0][c] = 1;
                mapa[LINHAS - 1][c] = 1;
            }
            for (let l = 0; l < LINHAS; l++) {
                mapa[l][0] = 1;
                mapa[l][COLUNAS - 1] = 1;
            }

            if (ehFaseBoss) {
                const plataformasBoss = [
                    { x: 4, y: 13, w: 6 },
                    { x: 20, y: 13, w: 6 },
                    { x: 11, y: 8, w: 8 }
                ];
                plataformasBoss.forEach(p => {
                    for (let i = 0; i < p.w; i++) mapa[p.y][p.x + i] = 1;
                });
            } else {
                let seed = (indice + 1) * 9301 + 49297;
                function randomSeed() {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                }

                const numPlataformas = 5 + Math.floor(randomSeed() * 4);
                for (let k = 0; k < numPlataformas; k++) {
                    const px = 3 + Math.floor(randomSeed() * (COLUNAS - 10));
                    const py = 4 + Math.floor(randomSeed() * (LINHAS - 7));
                    const pw = 4 + Math.floor(randomSeed() * 4);

                    for (let i = 0; i < pw; i++) {
                        if (px + i < COLUNAS - 1 && py < LINHAS - 1) {
                            mapa[py][px + i] = 1;
                        }
                    }
                }
            }

            mapa[LINHAS - 2][COLUNAS - 2] = 9;

            return {
                numero: indice + 1,
                nome: ehFaseBoss ? `[CHEFÃO] CÂMARA DO TRONO ${indice + 1}` : `${bioma.nome} - Andar ${indice + 1}`,
                fundo: bioma.fundo,
                bloco: bioma.bloco,
                bordaBloco: bioma.borda,
                mapa: mapa,
                ehBoss: ehFaseBoss
            };
        }

        const FASES = Array.from({ length: 100 }, (_, i) => gerarFase(i));

        let faseAtual = 0;
        let estadoJogo = "jogando";
        let geos = 0;
        let inimigos = [];
        let projeteisFogo = [];
        let projeteisInimigo = [];
        let particulasFogo = [];
        let rastrosDash = [];
        let lojaDisponivel = false;

        const jogador = {
            nome: "Ainz Ooal Gown",
            x: 64,
            y: 480,
            largura: 28,
            altura: 42,
            vx: 0,
            vy: 0,
            velocidade: 3.7,
            forcaPulo: -11.8,
            noChao: false,

            pulosRestantes: 2,
            maxPulos: 2,

            dashing: false,
            duracaoDash: 10,
            tempoDash: 0,
            velocidadeDash: 13,
            cooldownDash: 0,

            olhando: "direita",
            invulneravel: 0,
            cooldownAtaque: 0,

            nivel: 1,
            xp: 0,
            xpProximo: 100,
            hpBase: 100,
            hpMax: 100,
            hp: 100,
            pontosStatus: 0,

            inteligencia: 10,
            destreza: 5,
            vitalidade: 5,
            agilidade: 5,

            cajadoNivel: 1,
            capaVermelha: false,
            temEscudo: false,
            escudoAtivo: false,
            escudoDuracao: 0,
            escudoAbsorcao: 0,
            escudoCooldown: 0
        };

        const mercador = { x: 340, y: 480, largura: 32, altura: 38 };

        function obterItensLoja(fase) {
            const multiplicadorTier = Math.floor(fase / 10) + 1;
            return [
                { id: "cura", nome: `Frasco de Vitalidade T${multiplicadorTier}`, preco: 15 * multiplicadorTier, desc: `Restaura +${60 * multiplicadorTier} de HP instantaneamente.`, tipo: "cura", valor: 60 * multiplicadorTier },
                { id: "cajado", nome: `Cajado dos Deuses Anciões T${multiplicadorTier}`, preco: 30 * multiplicadorTier, desc: `Aumenta o dano do cajado.`, tipo: "cajado", valor: Math.min(3, 1 + multiplicadorTier) },
                { id: "escudo", nome: "Grimório da Barreira Cósmica", preco: 25, desc: "Permite usar [Q] para barreira de 35+ de absorção.", tipo: "escudo" },
                { id: "bencao", nome: "Bênção Arcana", preco: 20 * multiplicadorTier, desc: "+3 Pontos de Inteligência.", tipo: "int", valor: 3 }
            ];
        }

        let itensLojaAtuais = [];

        function iniciarAventura() {
            const nomeDigitado = inputNome.value.trim();
            if (nomeDigitado.length > 0) jogador.nome = nomeDigitado;
            hudNome.innerText = jogador.nome;
            telaInicial.style.display = "none";
            hud.style.display = "flex";
            controlesMobile.style.display = "flex";
            jogoIniciado = true;
            carregarFase(0);
        }

        function alternarPause() {
            if (!jogoIniciado || estadoJogo === "derrota" || estadoJogo === "vitoria" || estadoJogo === "loja") return;
            jogoPausado = !jogoPausado;
            btnPause.innerText = jogoPausado ? "▶️ Retomar [P]" : "⏸️ Pause [P]";
        }

        function alternarStatus() {
            if (!jogoIniciado || estadoJogo === "derrota" || estadoJogo === "vitoria" || estadoJogo === "loja") return;
            menuStatusAberto = !menuStatusAberto;
        }

        const teclas = {};
        window.addEventListener("keydown", (e) => {
            if (!jogoIniciado) return;
            const key = e.key.toLowerCase();

            if (key === "p" || (e.key === "Escape" && estadoJogo !== "loja" && !menuStatusAberto)) {
                alternarPause();
                return;
            }

            if (key === "c" && estadoJogo === "jogando") {
                alternarStatus();
                return;
            }

            if (menuStatusAberto) {
                if (key === "1") uparAtributo("int");
                if (key === "2") uparAtributo("des");
                if (key === "3") uparAtributo("vit");
                if (key === "4") uparAtributo("agi");
                if (key === "escape" || key === "c") menuStatusAberto = false;
                return;
            }

            if (jogoPausado) return;

            if (e.key === "Tab") {
                e.preventDefault();
                executarDash();
                return;
            }

            teclas[key] = true;

            if (key === "e" && lojaDisponivel) interagirLoja();
            if (estadoJogo === "loja") {
                if (key === "1") comprarItem(0);
                if (key === "2") comprarItem(1);
                if (key === "3") comprarItem(2);
                if (key === "4") comprarItem(3);
                if (key === "escape") estadoJogo = "jogando";
                return;
            }

            if (key === "q") ativarEscudo();
            if (e.code === "Space") executarPulo();
            if (key === "j") dispararMagiaFogo();
            if (key === "r" && (estadoJogo === "derrota" || estadoJogo === "vitoria")) reiniciarJogo();
        });

        window.addEventListener("keyup", (e) => teclas[e.key.toLowerCase()] = false);

        // CONTROLES MOBILE TOUCH EVENT BINDINGS
        function ligarBotaoTouch(id, onStart, onEnd) {
            const el = document.getElementById(id);
            el.addEventListener("touchstart", (e) => { e.preventDefault(); onStart(); });
            el.addEventListener("touchend", (e) => { e.preventDefault(); if (onEnd) onEnd(); });
        }

        ligarBotaoTouch("btn-left", () => teclas["a"] = true, () => teclas["a"] = false);
        ligarBotaoTouch("btn-right", () => teclas["d"] = true, () => teclas["d"] = false);
        ligarBotaoTouch("btn-up", () => teclas["w"] = true, () => teclas["w"] = false);
        ligarBotaoTouch("btn-jump", () => executarPulo());
        ligarBotaoTouch("btn-fire", () => dispararMagiaFogo());
        ligarBotaoTouch("btn-dash", () => executarDash());
        ligarBotaoTouch("btn-escudo", () => ativarEscudo());

        function interagirLoja() {
            const distMercador = Math.hypot((jogador.x + jogador.largura / 2) - (mercador.x + mercador.largura / 2), jogador.y - mercador.y);
            if (distMercador < 70) {
                if (estadoJogo === "loja") {
                    estadoJogo = "jogando";
                } else {
                    itensLojaAtuais = obterItensLoja(faseAtual);
                    estadoJogo = "loja";
                }
            }
        }

        function executarPulo() {
            if (jogador.pulosRestantes > 0 && estadoJogo === "jogando" && !jogador.dashing) {
                jogador.vy = jogador.forcaPulo;
                jogador.pulosRestantes--;
                jogador.noChao = false;
                if (jogador.pulosRestantes === 0) {
                    criarEfeitoPulo(jogador.x + jogador.largura / 2, jogador.y + jogador.altura);
                }
            }
        }

        function executarDash() {
            if (!jogador.dashing && jogador.cooldownDash <= 0 && estadoJogo === "jogando") {
                jogador.dashing = true;
                jogador.tempoDash = 0;
                jogador.cooldownDash = 28;
                jogador.vy = 0;
                const dir = jogador.olhando === "direita" ? 1 : -1;
                jogador.vx = dir * jogador.velocidadeDash;
                criarExplosaoFogo(jogador.x + jogador.largura / 2, jogador.y + jogador.altura / 2, 8);
            }
        }

        function uparAtributo(attr) {
            if (jogador.pontosStatus <= 0) return;
            jogador.pontosStatus--;
            if (attr === "int") jogador.inteligencia++;
            if (attr === "des") jogador.destreza++;
            if (attr === "vit") {
                jogador.vitalidade++;
                jogador.hpMax += 10;
                jogador.hp += 10;
            }
            if (attr === "agi") jogador.agilidade++;
            atualizarHUD();
        }

        function ganharXP(qtd) {
            jogador.xp += qtd;
            while (jogador.xp >= jogador.xpProximo) {
                jogador.xp -= jogador.xpProximo;
                jogador.nivel++;
                jogador.xpProximo = Math.floor(jogador.xpProximo * 1.35);

                jogador.hpBase += 10;
                jogador.hpMax = jogador.hpBase + (jogador.vitalidade - 5) * 10;
                jogador.hp = jogador.hpMax;
                jogador.pontosStatus += 3;

                criarExplosaoFogo(jogador.x + jogador.largura / 2, jogador.y, 30);
            }
            atualizarHUD();
        }

        function comprarItem(index) {
            const item = itensLojaAtuais[index];
            if (!item || item.comprado) return;

            if (geos >= item.preco) {
                geos -= item.preco;

                if (item.tipo === "cura") {
                    jogador.hp = Math.min(jogador.hpMax, jogador.hp + item.valor);
                } else if (item.tipo === "cajado") {
                    jogador.cajadoNivel = item.valor;
                    item.comprado = true;
                } else if (item.tipo === "escudo") {
                    jogador.temEscudo = true;
                    item.comprado = true;
                } else if (item.tipo === "int") {
                    jogador.inteligencia += item.valor;
                    item.comprado = true;
                }

                criarExplosaoFogo(jogador.x + jogador.largura / 2, jogador.y, 25);
                atualizarHUD();
            }
        }

        function ativarEscudo() {
            if (jogador.temEscudo && !jogador.escudoAtivo && jogador.escudoCooldown <= 0 && estadoJogo === "jogando") {
                jogador.escudoAtivo = true;
                jogador.escudoDuracao = 600;
                jogador.escudoAbsorcao = 35 + jogador.destreza;
                jogador.escudoCooldown = 800;
                atualizarHUD();
            }
        }

        function criarEfeitoPulo(x, y) {
            for (let i = 0; i < 10; i++) {
                particulasFogo.push({
                    x: x + (Math.random() - 0.5) * 16,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 2 + 1,
                    raio: Math.random() * 3 + 1.5,
                    vida: 16,
                    cor: "#a29bfe"
                });
            }
        }

        function dispararMagiaFogo() {
            if (jogador.cooldownAtaque > 0 || jogador.dashing || estadoJogo !== "jogando") return;

            const delayDisparo = Math.max(5, 10 - Math.floor(jogador.agilidade / 4));
            jogador.cooldownAtaque = delayDisparo;

            const mirandoCima = teclas["w"] || teclas["arrowup"];
            let posX, posY, velX, velY, larg, alt;

            const bonusCajado = jogador.cajadoNivel === 3 ? 50 : (jogador.cajadoNivel === 2 ? 22 : 0);
            const danoFinal = 26 + bonusCajado + Math.floor(jogador.inteligencia * 2.3);
            const multTam = jogador.cajadoNivel === 3 ? 1.5 : (jogador.cajadoNivel === 2 ? 1.25 : 1.0);

            if (mirandoCima) {
                posX = jogador.x + jogador.largura / 2 - 8;
                posY = jogador.y - 20;
                velX = 0;
                velY = -9.2;
                larg = 16 * multTam;
                alt = 24 * multTam;
            } else {
                const dir = jogador.olhando === "direita" ? 1 : -1;
                posX = jogador.olhando === "direita" ? jogador.x + jogador.largura + 8 : jogador.x - 24;
                posY = jogador.y + 18;
                velX = dir * 8.8;
                velY = 0;
                larg = 24 * multTam;
                alt = 22 * multTam;
            }

            projeteisFogo.push({
                x: posX,
                y: posY,
                largura: larg,
                altura: alt,
                vx: velX,
                vy: velY,
                dano: danoFinal,
                nivelCajado: jogador.cajadoNivel,
                ativo: true,
                tempoVida: 90
            });

            criarExplosaoFogo(posX + larg / 2, posY + alt / 2, 6);
        }

        function criarExplosaoFogo(x, y, quantidade = 12) {
            for (let i = 0; i < quantidade; i++) {
                particulasFogo.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    raio: Math.random() * 3.5 + 1.5,
                    vida: 18,
                    cor: jogador.cajadoNivel === 3 ? (Math.random() > 0.4 ? "#a29bfe" : "#e056fd") : (Math.random() > 0.4 ? "#ff7675" : "#fdcb6e")
                });
            }
        }

        function obterTile(px, py) {
            const c = Math.floor(px / TAM_BLOCO);
            const l = Math.floor(py / TAM_BLOCO);
            if (l < 0 || l >= LINHAS || c < 0 || c >= COLUNAS) return 1;
            return FASES[faseAtual].mapa[l][c];
        }

        function colideRetangulos(r1, r2) {
            return (
                r1.x < r2.x + r2.largura &&
                r1.x + r1.largura > r2.x &&
                r1.y < r2.y + r2.altura &&
                r1.y + r1.altura > r2.y
            );
        }

        function gerarInimigoSeguro(tipo, mapa) {
            const dim = {
                slime_azul:     { w: 24, h: 22, vida: 30,  geo: 1,  xp: 12,  dano: 12, vel: 0.75 },
                slime_vermelho: { w: 24, h: 22, vida: 45,  geo: 2,  xp: 20,  dano: 15, vel: 0.65 },
                slime_roxo:     { w: 24, h: 22, vida: 60,  geo: 3,  xp: 30,  dano: 18, vel: 0.85 },
                goblin:         { w: 24, h: 32, vida: 90,  geo: 5,  xp: 55,  dano: 22, vel: 1.25 },
                urso:           { w: 46, h: 46, vida: 240, geo: 10, xp: 130, dano: 32, vel: 0.70 },
                gargula:        { w: 32, h: 32, vida: 110, geo: 6,  xp: 70,  dano: 20, vel: 1.10 },
                espirito_fogo:  { w: 26, h: 26, vida: 75,  geo: 4,  xp: 45,  dano: 18, vel: 1.30 }
            }[tipo];

            for (let tentativas = 0; tentativas < 70; tentativas++) {
                const c = Math.floor(Math.random() * (COLUNAS - 8)) + 4;
                const l = Math.floor(Math.random() * (LINHAS - 3)) + 1;

                if (mapa[l + 1][c] === 1 && mapa[l][c] === 0) {
                    const posX = c * TAM_BLOCO + 4;
                    const posY = (l + 1) * TAM_BLOCO - dim.h;

                    return {
                        x: posX,
                        y: posY,
                        largura: dim.w,
                        altura: dim.h,
                        vx: (Math.random() > 0.5 ? 1 : -1) * dim.vel,
                        vy: 0,
                        tipo: tipo,
                        vida: dim.vida,
                        vidaMax: dim.vida,
                        geo: dim.geo,
                        xp: dim.xp,
                        dano: dim.dano,
                        noChao: true,
                        timerAcao: 0,
                        atacandoEspada: false
                    };
                }
            }

            return {
                x: 350, y: (LINHAS - 1) * TAM_BLOCO - dim.h, largura: dim.w, altura: dim.h,
                vx: dim.vel, vy: 0, tipo: tipo, vida: dim.vida, vidaMax: dim.vida,
                geo: dim.geo, xp: dim.xp, dano: dim.dano, noChao: true, timerAcao: 0, atacandoEspada: false
            };
        }

        // ============================================================
        // GERADOR DE 4 CLASSES ÚNICAS DE BOSS COM COMPORTAMENTOS DISTINTOS
        // ============================================================
        function gerarChefeFase(indiceFase) {
            const numeroBoss = Math.floor((indiceFase + 1) / 5);
            const classeBoss = (numeroBoss % 4); // 0: Colosso, 1: Dragão Necrótico, 2: Arquidemônio, 3: Tirano Abissal
            const hpBase = 1000 + (numeroBoss - 1) * 350;

            const bossConfig = [
                {
                    classe: "colosso",
                    nome: `Colosso de Granito [Boss ${numeroBoss}]`,
                    cor: "#57606f",
                    largura: 68, altura: 76,
                    temEscudo: (numeroBoss >= 3),
                    escudo: (numeroBoss >= 3) ? 250 : 0
                },
                {
                    classe: "dragao",
                    nome: `Dragão Necrótico [Boss ${numeroBoss}]`,
                    cor: "#16a085",
                    largura: 74, altura: 70,
                    temEscudo: true,
                    escudo: 300 + numeroBoss * 40
                },
                {
                    classe: "arquidemonio",
                    nome: `Arquidemônio Rúnico [Boss ${numeroBoss}]`,
                    cor: "#8e44ad",
                    largura: 64, altura: 80,
                    temEscudo: true,
                    escudo: 400 + numeroBoss * 50
                },
                {
                    classe: "tirano",
                    nome: `Tirano do Abismo [Boss ${numeroBoss}]`,
                    cor: "#c0392b",
                    largura: 70, altura: 74,
                    temEscudo: (numeroBoss >= 2),
                    escudo: 280 + numeroBoss * 45
                }
            ][classeBoss];

            return {
                x: 650,
                y: 400,
                largura: bossConfig.largura,
                altura: bossConfig.altura,
                vx: -0.9,
                vy: 0,
                tipo: "boss",
                classeBoss: bossConfig.classe,
                nome: bossConfig.nome,
                cor: bossConfig.cor,
                vida: hpBase,
                vidaMax: hpBase,
                temEscudo: bossConfig.temEscudo,
                escudo: bossConfig.escudo,
                escudoMax: bossConfig.escudo,
                geo: 35 * numeroBoss,
                xp: 450 * numeroBoss,
                dano: 28 + numeroBoss * 4,
                timerAcao: 0,
                noChao: true
            };
        }

        function carregarFase(indice) {
            faseAtual = indice;
            const fase = FASES[indice];

            jogador.x = 64;
            jogador.y = 480;
            jogador.vx = 0;
            jogador.vy = 0;
            jogador.pulosRestantes = jogador.maxPulos;
            jogador.dashing = false;
            projeteisFogo = [];
            projeteisInimigo = [];
            rastrosDash = [];
            lojaDisponivel = false;

            inimigos = [];

            if (fase.ehBoss) {
                inimigos.push(gerarChefeFase(indice));
            } else {
                const qtdMonstros = Math.min(15, 5 + Math.floor(indice * 0.25));
                const tipos = ["slime_azul", "slime_vermelho", "slime_roxo", "goblin", "urso", "gargula", "espirito_fogo"];

                for (let i = 0; i < qtdMonstros; i++) {
                    const tipoSorteado = tipos[Math.floor(Math.random() * tipos.length)];
                    inimigos.push(gerarInimigoSeguro(tipoSorteado, fase.mapa));
                }
            }

            atualizarHUD();
        }

        function reiniciarJogo() {
            jogador.nivel = 1;
            jogador.xp = 0;
            jogador.xpProximo = 100;
            jogador.hpBase = 100;
            jogador.vitalidade = 5;
            jogador.inteligencia = 10;
            jogador.destreza = 5;
            jogador.agilidade = 5;
            jogador.pontosStatus = 0;
            jogador.hpMax = 100;
            jogador.hp = 100;

            jogador.cajadoNivel = 1;
            jogador.capaVermelha = false;
            jogador.temEscudo = false;
            jogador.escudoAtivo = false;
            geos = 0;

            jogoPausado = false;
            menuStatusAberto = false;
            btnPause.innerText = "⏸️ Pause [P]";
            estadoJogo = "jogando";
            carregarFase(0);
        }

        function atualizarHUD() {
            const pctHp = Math.max(0, (jogador.hp / jogador.hpMax)) * 100;
            hpPreenchimento.style.width = `${pctHp}%`;
            hpTexto.innerText = `${Math.ceil(jogador.hp)} / ${jogador.hpMax} HP`;

            const pctXp = Math.min(100, (jogador.xp / jogador.xpProximo) * 100);
            xpPreenchimento.style.width = `${pctXp}%`;

            hudNivel.innerText = `Nv. ${jogador.nivel}` + (jogador.pontosStatus > 0 ? ` (+${jogador.pontosStatus})` : "");
            hudGeos.innerText = `Geo: ${geos}`;
            hudFase.innerText = `Fase: ${faseAtual + 1} / 100 (${FASES[faseAtual].nome})`;

            hudEscudo.innerText = jogador.escudoAtivo ? `Escudo: ${jogador.escudoAbsorcao} HP` : (jogador.temEscudo ? "Escudo: Pronto [Q]" : "Escudo: Inativo");
            hudEscudo.style.color = jogador.escudoAtivo ? "#00cec9" : (jogador.temEscudo ? "#74b9ff" : "#636e72");
        }

        function tomarDano(dano) {
            if (jogador.invulneravel > 0 || jogador.dashing) return;

            const reducaoDefesa = Math.floor(jogador.destreza * 0.7);
            let danoAposArmadura = Math.max(4, dano - reducaoDefesa);

            if (jogador.escudoAtivo) {
                if (jogador.escudoAbsorcao >= danoAposArmadura) {
                    jogador.escudoAbsorcao -= danoAposArmadura;
                    criarExplosaoFogo(jogador.x + jogador.largura / 2, jogador.y + jogador.altura / 2, 10);
                    if (jogador.escudoAbsorcao <= 0) jogador.escudoAtivo = false;
                    atualizarHUD();
                    return;
                } else {
                    danoAposArmadura -= jogador.escudoAbsorcao;
                    jogador.escudoAbsorcao = 0;
                    jogador.escudoAtivo = false;
                }
            }

            jogador.hp -= danoAposArmadura;
            jogador.invulneravel = 45;
            jogador.vy = -6;
            atualizarHUD();

            if (jogador.hp <= 0) {
                jogador.hp = 0;
                estadoJogo = "derrota";
            }
        }

        // ==========================================
        // LOOP DE ATUALIZAÇÃO
        // ==========================================
        function atualizar() {
            if (!jogoIniciado || estadoJogo !== "jogando" || jogoPausado || menuStatusAberto) return;

            if (jogador.invulneravel > 0) jogador.invulneravel--;
            if (jogador.cooldownAtaque > 0) jogador.cooldownAtaque--;
            if (jogador.cooldownDash > 0) jogador.cooldownDash--;
            if (jogador.escudoCooldown > 0) jogador.escudoCooldown--;

            if (jogador.escudoAtivo) {
                jogador.escudoDuracao--;
                if (jogador.escudoDuracao <= 0) {
                    jogador.escudoAtivo = false;
                    atualizarHUD();
                }
            }

            if (jogador.dashing) {
                jogador.tempoDash++;
                jogador.vy = 0;
                if (jogador.tempoDash % 2 === 0) {
                    rastrosDash.push({ x: jogador.x, y: jogador.y, olhando: jogador.olhando, vida: 12 });
                }
                if (jogador.tempoDash >= jogador.duracaoDash) {
                    jogador.dashing = false;
                    jogador.vx *= 0.4;
                }
            } else {
                if (teclas["d"] || teclas["arrowright"]) {
                    jogador.vx = jogador.velocidade;
                    jogador.olhando = "direita";
                } else if (teclas["a"] || teclas["arrowleft"]) {
                    jogador.vx = -jogador.velocidade;
                    jogador.olhando = "esquerda";
                } else {
                    jogador.vx *= 0.7;
                }
                jogador.vy += GRAVIDADE;
                if (jogador.vy > 12) jogador.vy = 12;
            }

            // Colisão Horizontal Jogador
            jogador.x += jogador.vx;
            if (jogador.vx > 0) {
                if (obterTile(jogador.x + jogador.largura, jogador.y + 4) === 1 ||
                    obterTile(jogador.x + jogador.largura, jogador.y + jogador.altura - 4) === 1) {
                    jogador.x = Math.floor((jogador.x + jogador.largura) / TAM_BLOCO) * TAM_BLOCO - jogador.largura;
                    jogador.vx = 0;
                    if (jogador.dashing) jogador.dashing = false;
                }
            } else if (jogador.vx < 0) {
                if (obterTile(jogador.x, jogador.y + 4) === 1 ||
                    obterTile(jogador.x, jogador.y + jogador.altura - 4) === 1) {
                    jogador.x = Math.floor(jogador.x / TAM_BLOCO + 1) * TAM_BLOCO;
                    jogador.vx = 0;
                    if (jogador.dashing) jogador.dashing = false;
                }
            }

            // Colisão Vertical Jogador
            jogador.y += jogador.vy;
            jogador.noChao = false;

            if (jogador.vy > 0) {
                if (obterTile(jogador.x + 4, jogador.y + jogador.altura) === 1 ||
                    obterTile(jogador.x + jogador.largura - 4, jogador.y + jogador.altura) === 1) {
                    jogador.y = Math.floor((jogador.y + jogador.altura) / TAM_BLOCO) * TAM_BLOCO - jogador.altura;
                    jogador.vy = 0;
                    jogador.noChao = true;
                    jogador.pulosRestantes = jogador.maxPulos;
                }
            } else if (jogador.vy < 0) {
                if (obterTile(jogador.x + 4, jogador.y) === 1 ||
                    obterTile(jogador.x + jogador.largura - 4, jogador.y) === 1) {
                    jogador.y = Math.floor(jogador.y / TAM_BLOCO + 1) * TAM_BLOCO;
                    jogador.vy = 0;
                }
            }

            // IA e Ataques Aleatórios dos Chefões e Monstros
            inimigos.forEach(ini => {
                ini.vy += GRAVIDADE;
                if (ini.vy > 10) ini.vy = 10;

                ini.y += ini.vy;
                ini.noChao = false;

                if (ini.vy > 0) {
                    if (obterTile(ini.x + 4, ini.y + ini.altura) === 1 ||
                        obterTile(ini.x + ini.largura - 4, ini.y + ini.altura) === 1) {
                        ini.y = Math.floor((ini.y + ini.altura) / TAM_BLOCO) * TAM_BLOCO - ini.altura;
                        ini.vy = 0;
                        ini.noChao = true;
                    }
                }

                const frenteX = ini.vx > 0 ? ini.x + ini.largura + 2 : ini.x - 2;
                if (obterTile(frenteX, ini.y + 4) === 1 || (ini.noChao && obterTile(frenteX, ini.y + ini.altura + 4) === 0)) {
                    ini.vx *= -1;
                }

                ini.x += ini.vx;
                ini.timerAcao++;

                if (ini.tipo === "boss") {
                    // ATAQUES ALEATÓRIOS DO CHEFE BASEADO NO SEU ARQUÉTIPO
                    if (ini.timerAcao > 110) {
                        ini.timerAcao = 0;
                        const sorteioAtaque = Math.random();

                        if (ini.classeBoss === "colosso") {
                            // 1. Colosso: Salto Sísmico ou Triplo Disparo
                            if (sorteioAtaque < 0.5) {
                                ini.vy = -9.0;
                                // Onda de choque no solo
                                projeteisInimigo.push({ x: ini.x - 20, y: ini.y + ini.altura - 10, vx: -5, vy: 0, raio: 8, dano: ini.dano, ativo: true });
                                projeteisInimigo.push({ x: ini.x + ini.largura + 20, y: ini.y + ini.altura - 10, vx: 5, vy: 0, raio: 8, dano: ini.dano, ativo: true });
                            } else {
                                const dir = jogador.x > ini.x ? 1 : -1;
                                for (let a = -0.25; a <= 0.25; a += 0.25) {
                                    projeteisInimigo.push({ x: ini.x + ini.largura / 2, y: ini.y + 20, vx: dir * 4.5, vy: a * 4.5, raio: 7, dano: ini.dano, ativo: true });
                                }
                            }
                        } else if (ini.classeBoss === "dragao") {
                            // 2. Dragão: Chuva de Meteoros ou Rajada Esmeralda
                            if (sorteioAtaque < 0.55) {
                                for (let m = 0; m < 4; m++) {
                                    projeteisInimigo.push({ x: jogador.x + (Math.random() - 0.5) * 160, y: 30, vx: 0, vy: 4.8, raio: 8, dano: ini.dano + 4, ativo: true });
                                }
                            } else {
                                const dir = jogador.x > ini.x ? 1 : -1;
                                projeteisInimigo.push({ x: ini.x + (dir > 0 ? ini.largura : 0), y: ini.y + 25, vx: dir * 6.5, vy: 0, raio: 12, dano: ini.dano + 6, ativo: true });
                            }
                        } else if (ini.classeBoss === "arquidemonio") {
                            // 3. Arquidemônio: Anel de 8 Projéteis 360 Graus
                            for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 4) {
                                projeteisInimigo.push({ x: ini.x + ini.largura / 2, y: ini.y + ini.altura / 2, vx: Math.cos(ang) * 4.2, vy: Math.sin(ang) * 4.2, raio: 6, dano: ini.dano, ativo: true });
                            }
                        } else if (ini.classeBoss === "tirano") {
                            // 4. Tirano: Investida em Arrancada ou Orbe Teleguiada
                            if (sorteioAtaque < 0.5) {
                                ini.vx = (jogador.x > ini.x ? 1 : -1) * 4.5;
                            } else {
                                const dx = jogador.x - ini.x;
                                const dy = jogador.y - ini.y;
                                const dist = Math.hypot(dx, dy) || 1;
                                projeteisInimigo.push({ x: ini.x + ini.largura / 2, y: ini.y + 20, vx: (dx / dist) * 2.8, vy: (dy / dist) * 2.8, raio: 9, dano: ini.dano + 8, ativo: true });
                            }
                        }
                    }
                } else if (ini.tipo === "slime_azul" && ini.noChao && ini.timerAcao > 110) {
                    ini.timerAcao = 0;
                    ini.vy = -6.8;
                } else if (ini.tipo === "slime_vermelho" && ini.timerAcao > 130) {
                    ini.timerAcao = 0;
                    const dirVeneno = (jogador.x > ini.x) ? 1 : -1;
                    projeteisInimigo.push({ x: ini.x + ini.largura / 2, y: ini.y + 4, vx: dirVeneno * 3.6, vy: -2.2, raio: 5, dano: 14, ativo: true });
                }

                if (colideRetangulos(jogador, ini)) tomarDano(ini.dano);
            });

            // Projéteis Jogador
            projeteisFogo.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.tempoVida--;

                particulasFogo.push({
                    x: p.x + p.largura / 2,
                    y: p.y + p.altura / 2,
                    vx: -p.vx * 0.15 + (Math.random() - 0.5),
                    vy: -p.vy * 0.15 + (Math.random() - 0.5),
                    raio: Math.random() * 2.5 + 1,
                    vida: 10,
                    cor: p.nivelCajado === 3 ? "#e056fd" : "#fdcb6e"
                });

                if (obterTile(p.x + p.largura / 2, p.y + p.altura / 2) === 1 || p.tempoVida <= 0) {
                    p.ativo = false;
                    criarExplosaoFogo(p.x + p.largura / 2, p.y + p.altura / 2);
                }

                inimigos.forEach(ini => {
                    if (p.ativo && colideRetangulos(p, ini)) {
                        let danoCausado = p.dano;

                        if (ini.temEscudo && ini.escudo > 0) {
                            if (ini.escudo >= danoCausado) {
                                ini.escudo -= danoCausado;
                                danoCausado = 0;
                            } else {
                                danoCausado -= ini.escudo;
                                ini.escudo = 0;
                            }
                        }

                        ini.vida -= danoCausado;
                        p.ativo = false;
                        criarExplosaoFogo(p.x + p.largura / 2, p.y + p.altura / 2);

                        if (ini.vida <= 0) {
                            geos += ini.geo;
                            ganharXP(ini.xp);

                            if (FASES[faseAtual].ehBoss) {
                                lojaDisponivel = true;
                                mercador.x = ini.x;
                            }
                        }
                        atualizarHUD();
                    }
                });
            });

            projeteisFogo = projeteisFogo.filter(p => p.ativo);
            inimigos = inimigos.filter(ini => ini.vida > 0);

            // Projéteis Inimigos
            projeteisInimigo.forEach(pv => {
                pv.x += pv.vx;
                pv.y += pv.vy;

                if (obterTile(pv.x, pv.y) === 1) pv.ativo = false;

                if (pv.ativo && colideRetangulos({ x: pv.x - pv.raio, y: pv.y - pv.raio, largura: pv.raio * 2, altura: pv.raio * 2 }, jogador)) {
                    pv.ativo = false;
                    tomarDano(pv.dano);
                }
            });
            projeteisInimigo = projeteisInimigo.filter(pv => pv.ativo);

            // Portal
            const centroX = jogador.x + jogador.largura / 2;
            const centroY = jogador.y + jogador.altura / 2;
            if (obterTile(centroX, centroY) === 9 && inimigos.length === 0) {
                if (faseAtual < FASES.length - 1) {
                    carregarFase(faseAtual + 1);
                } else {
                    estadoJogo = "vitoria";
                }
            }

            particulasFogo.forEach(pf => {
                pf.x += pf.vx;
                pf.y += pf.vy;
                pf.vida--;
            });
            particulasFogo = particulasFogo.filter(pf => pf.vida > 0);
            rastrosDash.forEach(r => r.vida--);
            rastrosDash = rastrosDash.filter(r => r.vida > 0);

            particulasAmbiente.forEach(p => {
                p.y += p.velY;
                p.x += p.velX;
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
            });
        }

        // ==========================================
        // RENDERIZAÇÃO
        // ==========================================
        function desenhar() {
            if (!jogoIniciado) return;

            const fase = FASES[faseAtual];

            ctx.fillStyle = fase.fundo;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particulasAmbiente.forEach(p => {
                ctx.fillStyle = `rgba(180, 215, 255, ${p.opacidade})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                ctx.fill();
            });

            // Mapa de Blocos
            for (let l = 0; l < LINHAS; l++) {
                for (let c = 0; c < COLUNAS; c++) {
                    const tipo = fase.mapa[l][c];
                    const px = c * TAM_BLOCO;
                    const py = l * TAM_BLOCO;

                    if (tipo === 1) {
                        ctx.fillStyle = fase.bloco;
                        ctx.fillRect(px, py, TAM_BLOCO, TAM_BLOCO);
                        ctx.strokeStyle = fase.bordaBloco;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px + 0.5, py + 0.5, TAM_BLOCO - 1, TAM_BLOCO - 1);
                    } else if (tipo === 9) {
                        ctx.fillStyle = (inimigos.length === 0) ? "#9b59b6" : "#2d3436";
                        ctx.beginPath();
                        ctx.arc(px + 16, py + 16, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "#f1c40f";
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            }

            // Loja do Mercador Pós-Chefe
            if (lojaDisponivel) {
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(mercador.x, mercador.y + 10, mercador.largura, mercador.altura - 10);
                ctx.fillStyle = "#8e44ad";
                ctx.beginPath();
                ctx.arc(mercador.x + mercador.largura / 2, mercador.y + 10, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(mercador.x + 8, mercador.y + 8, 4, 3);
                ctx.fillRect(mercador.x + 20, mercador.y + 8, 4, 3);
                ctx.font = "bold 11px sans-serif";
                ctx.fillText("BAZAR DO CHEFE [E]", mercador.x - 14, mercador.y - 12);
            }

            // DESENHO DOS CHEFÕES COM SILHUETAS DIFERENCIADAS
            inimigos.forEach(ini => {
                const ix = ini.x;
                const iy = ini.y;

                if (ini.tipo === "boss") {
                    ctx.fillStyle = ini.cor;
                    ctx.fillRect(ix + 6, iy + 14, ini.largura - 12, ini.altura - 14);

                    if (ini.classeBoss === "colosso") {
                        // Colosso: Placas de pedra cinzentas e cristais nos ombros
                        ctx.fillStyle = "#2f3542";
                        ctx.fillRect(ix, iy + 20, 14, 16);
                        ctx.fillRect(ix + ini.largura - 14, iy + 20, 14, 16);
                        ctx.fillStyle = "#f1c40f";
                        ctx.fillRect(ix + 18, iy + 18, 6, 6);
                        ctx.fillRect(ix + ini.largura - 24, iy + 18, 6, 6);
                    } else if (ini.classeBoss === "dragao") {
                        // Dragão Necrótico: Asas esmeralda e crânio réptil
                        ctx.fillStyle = "#1abc9c";
                        ctx.beginPath();
                        ctx.moveTo(ix, iy + 10); ctx.lineTo(ix - 24, iy - 20); ctx.lineTo(ix + 10, iy + 30);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(ix + ini.largura, iy + 10); ctx.lineTo(ix + ini.largura + 24, iy - 20); ctx.lineTo(ix + ini.largura - 10, iy + 30);
                        ctx.fill();
                    } else if (ini.classeBoss === "arquidemonio") {
                        // Arquidemônio: Chifres duplos e manto escuro
                        ctx.fillStyle = "#2c1038";
                        ctx.fillRect(ix - 4, iy + 24, ini.largura + 8, ini.altura - 24);
                        ctx.fillStyle = "#e056fd";
                        ctx.fillRect(ix + 16, iy + 16, 7, 7);
                        ctx.fillRect(ix + ini.largura - 23, iy + 16, 7, 7);
                    } else if (ini.classeBoss === "tirano") {
                        // Tirano Abissal: Olhos múltiplos rubros e carapaça
                        ctx.fillStyle = "#74121d";
                        ctx.fillRect(ix - 5, iy + 12, 10, 14);
                        ctx.fillRect(ix + ini.largura - 5, iy + 12, 10, 14);
                        ctx.fillStyle = "#ff4757";
                        ctx.fillRect(ix + 14, iy + 14, 6, 6);
                        ctx.fillRect(ix + 24, iy + 14, 6, 6);
                        ctx.fillRect(ix + ini.largura - 30, iy + 14, 6, 6);
                        ctx.fillRect(ix + ini.largura - 20, iy + 14, 6, 6);
                    }

                    // Escudo Rúnico do Boss
                    if (ini.temEscudo && ini.escudo > 0) {
                        ctx.save();
                        ctx.strokeStyle = "rgba(116, 185, 255, 0.9)";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(ix - 8, iy - 10, ini.largura + 16, ini.altura + 16);
                        ctx.restore();
                    }

                    // Barra de Vida do Boss
                    ctx.fillStyle = "#1e272e";
                    ctx.fillRect(ix - 10, iy - 16, ini.largura + 20, 8);
                    ctx.fillStyle = "#e74c3c";
                    ctx.fillRect(ix - 10, iy - 16, (ini.largura + 20) * (ini.vida / ini.vidaMax), 8);

                    if (ini.temEscudo && ini.escudo > 0) {
                        ctx.fillStyle = "#00cec9";
                        ctx.fillRect(ix - 10, iy - 22, (ini.largura + 20) * (ini.escudo / ini.escudoMax), 4);
                    }
                } else if (ini.tipo.startsWith("slime")) {
                    if (ini.tipo === "slime_azul") ctx.fillStyle = "#0984e3";
                    else if (ini.tipo === "slime_vermelho") ctx.fillStyle = "#d63031";
                    else if (ini.tipo === "slime_roxo") ctx.fillStyle = "#6c5ce7";
                    ctx.beginPath();
                    ctx.ellipse(ix + ini.largura / 2, iy + ini.altura / 2, ini.largura / 2, ini.altura / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(ix + 6, iy + 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (ini.tipo === "urso") {
                    ctx.fillStyle = "#2c1810";
                    ctx.fillRect(ix - 1, iy - 1, ini.largura + 2, ini.altura + 2);
                    ctx.fillStyle = "#8a583e";
                    ctx.fillRect(ix + 4, iy - 2, 10, 10);
                    ctx.fillRect(ix + ini.largura - 14, iy - 2, 10, 10);
                    ctx.fillStyle = "#d3a89e";
                    ctx.fillRect(ix + 6, iy, 6, 6);
                    ctx.fillRect(ix + ini.largura - 12, iy, 6, 6);
                    ctx.fillStyle = "#8a583e";
                    ctx.fillRect(ix + 5, iy + 4, ini.largura - 10, 24);
                    ctx.fillStyle = "#e74c3c";
                    ctx.fillRect(ix + 9, iy + 9, 8, 6);
                    ctx.fillRect(ix + ini.largura - 17, iy + 9, 8, 6);
                    ctx.fillStyle = "#5c1d1d";
                    ctx.fillRect(ix + 10, iy + 21, ini.largura - 20, 6);
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(ix + 12, iy + 21, 3, 3);
                    ctx.fillRect(ix + ini.largura - 15, iy + 21, 3, 3);
                } else {
                    ctx.fillStyle = "#27ae60";
                    ctx.fillRect(ix + 4, iy + 6, ini.largura - 8, ini.altura - 6);
                }

                if (ini.tipo !== "boss") {
                    ctx.fillStyle = "#1e272e";
                    ctx.fillRect(ix, iy - 7, ini.largura, 4);
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(ix, iy - 7, ini.largura * (ini.vida / ini.vidaMax), 4);
                }
            });

            // Projéteis Inimigos
            projeteisInimigo.forEach(pv => {
                ctx.fillStyle = "#e74c3c";
                ctx.shadowColor = "#e74c3c";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(pv.x, pv.y, pv.raio, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Personagem Ainz Ooal Gown
            if (jogador.invulneravel % 4 < 2) {
                const jx = jogador.x;
                const jy = jogador.y;
                const jw = jogador.largura;
                const jh = jogador.altura;
                const olhandoDir = jogador.olhando === "direita";
                const mirandoCima = teclas["w"] || teclas["arrowup"];

                ctx.fillStyle = jogador.capaVermelha ? "#7b1113" : "#0d0914";
                ctx.beginPath();
                ctx.moveTo(jx - 4, jy + 16); ctx.lineTo(jx + jw + 4, jy + 16);
                ctx.lineTo(jx + jw + 8, jy + jh); ctx.lineTo(jx - 8, jy + jh);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#2d1645";
                ctx.beginPath();
                ctx.moveTo(jx + 4, jy + 18); ctx.lineTo(jx + jw - 4, jy + 18);
                ctx.lineTo(jx + jw - 2, jy + jh); ctx.lineTo(jx + 2, jy + jh);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#ded8c8";
                ctx.fillRect(jx + jw / 2 - 2, jy + 14, 4, 12);
                ctx.fillRect(jx + jw / 2 - 7, jy + 16, 14, 2);
                ctx.fillRect(jx + jw / 2 - 6, jy + 20, 12, 2);

                const pulsoCoracao = Math.sin(Date.now() / 150) * 1.2;
                ctx.fillStyle = "#c0392b";
                ctx.beginPath();
                ctx.arc(jx + jw / 2, jy + 22, 3.5 + pulsoCoracao, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#b8b2a5";
                ctx.beginPath(); ctx.arc(jx - 2, jy + 14, 6, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(jx + jw + 2, jy + 14, 6, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = "#e74c3c";
                ctx.beginPath(); ctx.arc(jx - 2, jy + 13, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(jx + jw + 2, jy + 13, 4, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = "#f5f6fa";
                ctx.beginPath(); ctx.ellipse(jx + jw / 2, jy + 8, 7, 8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(jx + jw / 2 - 3, jy + 12, 6, 4);

                ctx.fillStyle = "#0a0305";
                const olhoX1 = olhandoDir ? jx + jw / 2 : jx + jw / 2 - 5;
                const olhoX2 = olhandoDir ? jx + jw / 2 + 3 : jx + jw / 2 - 2;
                ctx.fillRect(olhoX1, jy + 7, 3, 3);
                ctx.fillRect(olhoX2, jy + 7, 3, 3);
                ctx.fillStyle = "#ff0033";
                ctx.fillRect(olhoX1 + 1, jy + 8, 1.5, 1.5);
                ctx.fillRect(olhoX2 + 1, jy + 8, 1.5, 1.5);

                let cajadoX = mirandoCima ? jx + jw / 2 - 2 : (olhandoDir ? jx + jw + 6 : jx - 10);
                let cajadoY = mirandoCima ? jy - 18 : jy + 2;

                ctx.fillStyle = jogador.cajadoNivel === 3 ? "#f39c12" : (jogador.cajadoNivel === 2 ? "#7f8c8d" : "#5d4037");
                ctx.fillRect(cajadoX, cajadoY, 4, 32);

                const corGema = jogador.cajadoNivel === 3 ? "#9b59b6" : (jogador.cajadoNivel === 2 ? "#e74c3c" : "#e67e22");
                ctx.fillStyle = corGema;
                ctx.beginPath();
                ctx.arc(cajadoX + 2, cajadoY, 5, 0, Math.PI * 2);
                ctx.fill();

                if (jogador.escudoAtivo) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(0, 206, 201, 0.9)";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(jx + jw / 2, jy + jh / 2, 30, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Projéteis Jogador
            projeteisFogo.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.nivelCajado === 3 ? "#e056fd" : (p.nivelCajado === 2 ? "#ff7675" : "#ffeaa7");
                ctx.shadowColor = p.nivelCajado === 3 ? "#be2edd" : "#d63031";
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.ellipse(p.x + p.largura / 2, p.y + p.altura / 2, p.largura / 2, p.altura / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            particulasFogo.forEach(pf => {
                ctx.fillStyle = pf.cor;
                ctx.beginPath();
                ctx.arc(pf.x, pf.y, pf.raio, 0, Math.PI * 2);
                ctx.fill();
            });

            // Menus Overlay (Status, Loja, Pause, Fim)
            if (menuStatusAberto) {
                ctx.fillStyle = "rgba(4, 5, 10, 0.95)";
                ctx.fillRect(160, 60, canvas.width - 320, canvas.height - 120);
                ctx.strokeStyle = "#9b59b6";
                ctx.lineWidth = 2;
                ctx.strokeRect(160, 60, canvas.width - 320, canvas.height - 120);

                ctx.fillStyle = "#f1c40f";
                ctx.font = "bold 20px 'Cinzel', serif";
                ctx.textAlign = "center";
                ctx.fillText(`STATUS: ${jogador.nome.toUpperCase()}`, canvas.width / 2, 105);

                ctx.font = "13px sans-serif";
                ctx.fillStyle = "#dfe6e9";
                ctx.fillText(`Nível: ${jogador.nivel}  |  Pontos: ${jogador.pontosStatus}`, canvas.width / 2, 132);

                const atributos = [
                    { nome: "Inteligência (INT)", valor: jogador.inteligencia, desc: `+${Math.floor(jogador.inteligencia * 2.3)} Dano`, key: "1" },
                    { nome: "Destreza (DES)", valor: jogador.destreza, desc: `+${Math.floor(jogador.destreza * 0.7)} Redução`, key: "2" },
                    { nome: "Vitalidade (VIT)", valor: jogador.vitalidade, desc: `+${(jogador.vitalidade - 5) * 10} HP Máx`, key: "3" },
                    { nome: "Agilidade (AGI)", valor: jogador.agilidade, desc: `Recarga rápida`, key: "4" }
                ];

                atributos.forEach((attr, idx) => {
                    const yPos = 165 + idx * 60;
                    ctx.fillStyle = "#1e1329";
                    ctx.fillRect(200, yPos, canvas.width - 400, 48);
                    ctx.textAlign = "left";
                    ctx.fillStyle = "#f5f6fa";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText(`[${attr.key}] ${attr.nome}: ${attr.valor}`, 220, yPos + 22);
                    ctx.font = "11px sans-serif";
                    ctx.fillStyle = "#a29bfe";
                    ctx.fillText(attr.desc, 220, yPos + 38);
                    ctx.textAlign = "right";
                    ctx.fillStyle = jogador.pontosStatus > 0 ? "#2ecc71" : "#7f8c8d";
                    ctx.font = "bold 13px sans-serif";
                    ctx.fillText(jogador.pontosStatus > 0 ? "+ UPAR" : "—", canvas.width - 220, yPos + 30);
                });

                ctx.textAlign = "center";
                ctx.fillStyle = "#74b9ff";
                ctx.font = "12px sans-serif";
                ctx.fillText("Toque [1-4] ou clique para subir atributo | Fechar [C]", canvas.width / 2, canvas.height - 80);
            }

            if (estadoJogo === "loja") {
                ctx.fillStyle = "rgba(5, 7, 12, 0.95)";
                ctx.fillRect(120, 50, canvas.width - 240, canvas.height - 100);
                ctx.strokeStyle = "#f1c40f";
                ctx.lineWidth = 2;
                ctx.strokeRect(120, 50, canvas.width - 240, canvas.height - 100);

                ctx.fillStyle = "#f1c40f";
                ctx.font = "bold 20px 'Cinzel', serif";
                ctx.textAlign = "center";
                ctx.fillText(`BAZAR DO CHEFE - ANDAR ${faseAtual + 1}`, canvas.width / 2, 95);

                ctx.font = "14px sans-serif";
                ctx.fillStyle = "#dfe6e9";
                ctx.fillText(`Geos: ${geos} G`, canvas.width / 2, 122);

                itensLojaAtuais.forEach((item, idx) => {
                    const yPos = 145 + idx * 72;
                    ctx.fillStyle = item.comprado ? "#636e72" : "#1e272e";
                    ctx.fillRect(160, yPos, canvas.width - 320, 58);
                    ctx.textAlign = "left";
                    ctx.fillStyle = item.comprado ? "#b2bec3" : "#ffeaa7";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText(`[${idx + 1}] ${item.nome}`, 180, yPos + 22);
                    ctx.font = "11px sans-serif";
                    ctx.fillStyle = "#a4b0be";
                    ctx.fillText(item.desc, 180, yPos + 42);
                    ctx.textAlign = "right";
                    ctx.font = "bold 13px sans-serif";
                    ctx.fillStyle = item.comprado ? "#00cec9" : "#f1c40f";
                    ctx.fillText(item.comprado ? "ADQUIRIDO" : `${item.preco} GEO`, canvas.width - 185, yPos + 32);
                });

                ctx.textAlign = "center";
                ctx.fillStyle = "#74b9ff";
                ctx.font = "12px sans-serif";
                ctx.fillText("Toque [1-4] para comprar | Fechar [E]", canvas.width / 2, canvas.height - 75);
            }

            if (jogoPausado && estadoJogo === "jogando") {
                ctx.fillStyle = "rgba(4, 7, 12, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#74b9ff";
                ctx.font = "bold 32px 'Cinzel', serif";
                ctx.textAlign = "center";
                ctx.fillText("JOGO PAUSADO", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = "#dfe6e9";
                ctx.font = "14px sans-serif";
                ctx.fillText("Toque em 'Retomar' para continuar.", canvas.width / 2, canvas.height / 2 + 25);
            }

            if (estadoJogo === "derrota") {
                ctx.fillStyle = "rgba(2, 4, 7, 0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff7675";
                ctx.font = "26px 'Cinzel', serif";
                ctx.textAlign = "center";
                ctx.fillText(`${jogador.nome.toUpperCase()} FOI DERRUBADO`, canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "14px sans-serif";
                ctx.fillStyle = "#718093";
                ctx.fillText("Pressione 'R' para recomeçar a jornada.", canvas.width / 2, canvas.height / 2 + 30);
            } else if (estadoJogo === "vitoria") {
                ctx.fillStyle = "rgba(2, 4, 7, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#f1c40f";
                ctx.font = "26px 'Cinzel', serif";
                ctx.textAlign = "center";
                ctx.fillText(`GLÓRIA A ${jogador.nome.toUpperCase()}! 100 FASES CONQUISTADAS!`, canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#9b59b6";
                ctx.font = "16px sans-serif";
                ctx.fillText(`Nível Final: ${jogador.nivel}  |  Total Geos: ${geos}`, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() {
            atualizar();
            desenhar();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
